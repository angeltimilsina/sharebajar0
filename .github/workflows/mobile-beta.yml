name: BAJAR mobile beta verification
on:
  pull_request:
    paths:
      - 'mobile-app/**'
      - 'static/shared/**'
      - '.github/workflows/mobile-beta.yml'
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - 'static/shared/**'
      - '.github/workflows/mobile-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Build web preview bundle (not production deployment)
        run: npx expo export --platform web --output-dir dist-web
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid
      - uses: actions/upload-artifact@v4
        with:
          name: bajar-mobile-web-build
          path: mobile-app/dist-web
          if-no-files-found: error
